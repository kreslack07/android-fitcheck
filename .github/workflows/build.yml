name: Build & Release TWA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA project
        run: |
          echo "n" | bubblewrap init --manifest https://raw.githubusercontent.com/kreslack07/android-fitcheck/main/manifest.json --directory twa-project
        continue-on-error: true

      - name: Build TWA APK with Gradle
        run: |
          cd twa-project
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitcheck-release
          path: |
            twa-project/app/build/outputs/apk/release/*.apk
            twa-project/app/build/outputs/bundle/release/*.aab
